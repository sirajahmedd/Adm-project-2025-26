services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16
    ports:
      # Host port 5432 is often taken by a local Postgres.
      # Override with POSTGRES_PORT=5432 if you want the default.
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=mobility
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  neo4j_data:
  postgres_data:

